[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "Routing layer that sends each LLM request to the cheapest model that can handle it, verifies decisions, and learns from failures."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins: the classifier is pickled with joblib, and a pickle is only
# guaranteed to load with the same scikit-learn version it was saved with.
dependencies = [
    "openai==3.31.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.5.4",
    "pandas==3.0.6",
    "httpx==0.28.1",
]

[project.optional-dependencies]
# Streamlit dashboard
dashboard = ["streamlit==1.65.0"]
# Dataset download for sampling prompts (Hugging Face)
data = ["datasets==5.1.0"]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
